    <script>
        // function findLargest(arr){

        function findLargest(arr){
            arr.sort((a,b)=>a-b)
            let max=arr[arr.length-1]
            return max
        }
       
     arr = [1,3,4,5,6,8]
     console.log(findLargest(arr))

    </script>
