    <script>
        function caesarCipher (s,k){
        k = k%26;
        let value = ''
        let alphabetLower = "abcdefghijklmnopqrstuvwxyz";
        let alphabetUpper = "ABCDEFGHIJKLMNOPQRSTUVWXYZ";

        for(let i = 0 ; i < s.length ;i++){
            let char = s[i]
            let shiftedChar = char;

            if(alphabetLower.includes(char)){
                let index = alphabetLower.indexOf(char)
                let newIndex = (index+k)%26
                shiftedChar = alphabetLower[newIndex]
                
            }else if (alphabetUpper.includes(char)){
                let index = alphabetUpper.indexOf(char)
                let newIndex = (index+k)%26
                shiftedChar = alphabetUpper[newIndex]
            }
            value += shiftedChar
        }
        return value
        }
