   <script>
    function marsExploration(s) {
        let expectPattern ='SOS'
        let alteredCount = 0

        for (let i = 0; i<s.length ; i++){
            if(s[i]!== expectPattern[i%3]){
                alteredCount++
            }
        }
     return alteredCount
    }

 
const receivedSignal = "SOSSPSSQSSOR";
console.log(marsExploration(receivedSignal)); // Output: 3
   </script>
