    <script>
        function addStrings(str1, str2) {
    let result = '';
    let i = 0;

    
    for (i = 0; str1[i] !== undefined; i++) {
        result += str1[i];
    }

    
    
    for (i = 0; str2[i] !== undefined; i++) {
        result += str2[i];
    }

    return result;
}


let str1 = "Hello";
let str2 = "World";
let result = addStrings(str1, str2);
console.log(result); 
    </script>
